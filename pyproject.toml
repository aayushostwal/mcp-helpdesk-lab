[project]
name = "mcp-helpdesk-lab"
version = "0.1.0"
description = "A production-grade helpdesk API, an MCP server over it, and a benchmark of MCP tool designs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aayush Ostwal" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.1",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "httpx>=0.27",
  "faker>=28.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[project.scripts]
helpdesk = "helpdesk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk", "src/helpdesk_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/helpdesk/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT", "ASYNC", "N"]
ignore = ["S101", "B008", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S101", "PT018", "E501"]
"src/helpdesk/migrations/**" = ["N999"]
"src/helpdesk/api/routers/*.py" = ["E501"]
"src/helpdesk/seeding.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
exclude = ["src/helpdesk/migrations/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["src/helpdesk"]
concurrency = ["thread", "greenlet"]
omit = ["src/helpdesk/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
